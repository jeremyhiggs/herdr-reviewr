# cargo-deny config (https://embarkstudios.github.io/cargo-deny/).
# Run `cargo deny check` (install: `cargo install cargo-deny`).

[advisories]
yanked = "deny"
ignore = [
    # Unmaintained bincode 1 (RUSTSEC-2025-0141) reads only syntect's own bundled dumps, never
    # untrusted input. Drop this when syntect moves off bincode 1.
    "RUSTSEC-2025-0141",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[licenses]
# Permissive licenses we accept for dependencies.
allow = [
    # 0BSD is MIT without the notice requirement (today: doctest-file and recvmsg, through
    # interprocess, the Windows named-pipe client).
    "0BSD",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    # MPL-2.0 is file-level copyleft: accepted for unmodified crates.io dependencies only (today
    # option-ext, via dirs), where it imposes nothing on this MIT binary.
    "MPL-2.0",
]
confidence-threshold = 0.9

[sources]
unknown-registry = "deny"
unknown-git = "deny"
